name: DeadlineBoard
options:
  bundleIdPrefix: com.deadlineboard
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  DeadlineBoard:
    type: application
    platform: macOS
    sources:
      - path: DeadlineBoard
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadlineboard.app
        CODE_SIGN_ENTITLEMENTS: DeadlineBoard/DeadlineBoard.entitlements
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        INFOPLIST_FILE: DeadlineBoard/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: true
    dependencies:
      - target: DeadlineBoardWidgetExtension
        embed: true

  DeadlineBoardWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: DeadlineBoardWidget
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadlineboard.app.widget
        INFOPLIST_FILE: DeadlineBoardWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeadlineBoardWidget/DeadlineBoardWidget.entitlements
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  DeadlineBoardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DeadlineBoardTests
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadlineboard.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  DeadlineBoard:
    build:
      targets:
        DeadlineBoard: all
        DeadlineBoardWidgetExtension: all
        DeadlineBoardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeadlineBoardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
